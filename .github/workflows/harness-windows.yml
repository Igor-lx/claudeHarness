# Runs the harness self-tests on Windows: the harness promises portability,
# and its tool compares paths that Windows writes with another separator.
name: harness-windows

on:
  workflow_dispatch:
  # A tool or seat edit is tested on Windows without being remembered.
  # Every branch, not only main: on main alone a red run showed up only
  # after the merge, and harness-windows stayed red for twenty runs unnoticed.
  push:
    paths:
      - .claude/tools/**
      - .claude/seat/**
      - .github/workflows/harness-windows.yml

jobs:
  self-tests:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The verified set lives in the seed; a copy here would lag behind it.
          node-version-file: .claude/seat/templates/.nvmrc

      - name: npm of the verified set
        run: |
          npm_need="$(node --input-type=module -e 'const { CONFIG } = await import("./.claude/seat/templates/graph.config.mjs"); console.log(CONFIG.verifiedVersions.npm)')"
          npm i -g "npm@$npm_need"

      - name: Git identity for the test seat commits
        run: |
          git config --global user.name "harness-ci"
          git config --global user.email "harness-ci@users.noreply.github.com"

      - name: Machine fits the verified set
        run: node .claude/tools/graph.mjs env

      - name: Seat a test stand from this shelf
        # The seat exit code is the knowledge-base check code; the stand is
        # still laid when it is red, and the self-tests below must run.
        run: |
          set +e
          node .claude/tools/graph.mjs seat "$RUNNER_TEMP/wseat"
          echo "seat exit $?"

      - name: Harness self-tests
        working-directory: ${{ runner.temp }}/wseat
        run: >-
          npx vitest run --config .claude/tools/vitest.config.mjs
          --reporter=dot --reporter=json
          --outputFile.json="$RUNNER_TEMP/tests.json"

      # The last steps print the failures and red checks at the log's end;
      # a failure keeps the head of its message, where the diff is.
      - name: Failed tests, one line each
        if: always()
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            for (const f of r.testResults)
              for (const t of f.assertionResults)
                if (t.status === "failed")
                  console.log(f.name.split(/[\\/]/).pop() + " > " + t.fullName + " :: " +
                    String(t.failureMessages[0] ?? "").slice(0, 1200).replace(/\s*\n\s*/g, " | "));
          ' "$RUNNER_TEMP/tests.json"

      - name: Knowledge-base check of the stand
        if: always()
        working-directory: ${{ runner.temp }}/wseat
        run: |
          set +e
          node .claude/tools/graph.mjs verify
          echo "verify exit $?"
